<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<title>Flores amarillas 🌻</title>
<style>
* { box-sizing: border-box; }

:root{
  --yellow:#ffd83d;
  --night:#05050a;
  --paper:#f8f0df;
  --ink:#4e3525;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html, body{ width:100%; min-height:100%; margin:0; }

body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 30%, rgba(116,65,142,.22), transparent 38%),
    radial-gradient(circle at 18% 82%, rgba(255,190,40,.07), transparent 28%),
    #05050a;
  color:#fff;
  font-family: Georgia,"Times New Roman",serif;
}

button{ font:inherit; }

.scene{ min-height:100vh; position:relative; isolation:isolate; }

.screen{
  min-height:100vh; width:100%;
  position:absolute; inset:0;
  display:grid; place-items:center;
  padding:26px 16px 40px;
  opacity:0; pointer-events:none;
  transform:scale(1.03);
  transition:opacity .7s ease, transform .7s ease;
}
.screen.active{ opacity:1; pointer-events:auto; transform:scale(1); }

.intro{ width:min(780px,100%); text-align:center; position:relative; z-index:2; }

.eyebrow{
  color:#f4d66b; letter-spacing:.14em; text-transform:uppercase;
  font-size:.72rem; margin:0 0 12px; opacity:.85;
}

h1{
  margin:0;
  font-size:clamp(2.1rem,6.5vw,4.4rem);
  line-height:1.02; font-weight:500; font-style:italic;
  color:#ffdf7a;
  text-shadow:0 0 28px rgba(255,196,46,.35), 0 0 60px rgba(255,160,20,.18);
}
h1 span{ color:var(--yellow); }

.subtitle{
  max-width:560px; margin:16px auto 0;
  color:#c9c2ce; line-height:1.6;
  font-size:clamp(.88rem,2.2vw,1.05rem);
}

.moon-glow{
  position:absolute;
  width:min(660px,88vw); height:min(660px,88vw);
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,194,45,.10), transparent 68%);
  filter:blur(6px);
}

/* ---------- RAMO ---------- */
.bouquet{
  position:relative;
  width:min(540px,94vw);
  height:min(400px,66vw);
  margin:6px auto 4px;
  filter:drop-shadow(0 26px 34px rgba(0,0,0,.55));
}

/* Cono de papel */
.wrap{
  position:absolute; left:50%; bottom:2%;
  transform:translateX(-50%);
  width:46%; height:46%;
  clip-path:polygon(3% 0, 97% 0, 63% 100%, 37% 100%);
  background:
    linear-gradient(103deg,
      #6d1670 0%, #a52a9c 18%, #e07ac4 38%,
      #f3a9da 50%, #cf57b2 64%, #8d1f88 86%, #5d1266 100%);
  animation:wrapSway 7s ease-in-out infinite;
  transform-origin:50% 100%;
}
.wrap::before{           /* dobleces del papel */
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(101deg,
    rgba(255,255,255,.16) 0 2px,
    rgba(255,255,255,0) 2px 9%,
    rgba(0,0,0,.18) 9.1% 9.6%,
    rgba(255,255,255,0) 9.7% 18%);
  mix-blend-mode:overlay;
}
.wrap::after{            /* borde superior del cono */
  content:""; position:absolute; left:-2%; right:-2%; top:-4%;
  height:14%; border-radius:50%;
  background:linear-gradient(90deg,#7a1a7c,#f0a0d6 45%,#8d2089);
  opacity:.9;
  box-shadow:inset 0 3px 8px rgba(255,255,255,.35);
}

.ribbon{
  position:absolute; left:50%; bottom:11%;
  transform:translateX(-50%) rotate(-2deg);
  width:22%; height:6%;
  border-radius:4px;
  background:linear-gradient(180deg,#ffe07a,#e8a72a);
  box-shadow:0 3px 8px rgba(0,0,0,.35);
  z-index:5;
}

.stems{
  position:absolute; left:50%; bottom:30%;
  transform:translateX(-50%);
  width:14%; height:34%;
  background:
    repeating-linear-gradient(88deg,#25452c 0 5px,#3a6b3e 5px 9px);
  border-radius:0 0 40% 40%;
  z-index:0;
}

.leaf{
  position:absolute; z-index:1;
  width:16%; height:9%;
  background:linear-gradient(120deg,#2f6b3a,#57a35c);
  border-radius:100% 0 100% 0;
  box-shadow:inset 0 0 8px rgba(0,0,0,.25);
}
.leaf-l{ left:13%; bottom:34%; transform:rotate(18deg) scaleX(-1); }
.leaf-r{ right:12%; bottom:37%; transform:rotate(-16deg); }

/* ---------- GIRASOL ---------- */
.flower{
  position:absolute;
  width:var(--size); height:var(--size);
  margin-left:calc(var(--size) / -2);
  margin-top:calc(var(--size) / -2);
  z-index:var(--z,3);
}
.flower-in{                       /* entrada: florecer */
  width:100%; height:100%;
  transform:scale(.2) rotate(-45deg);
  opacity:0;
  animation:bloom .9s cubic-bezier(.22,1.2,.36,1) forwards;
  animation-delay:var(--delay,0s);
}
.flower-core{                     /* vaivén suave */
  position:relative; width:100%; height:100%;
  animation:sway var(--sway,6s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}

.petal{
  position:absolute;
  left:50%; bottom:50%;
  width:19%; height:50%;
  margin-left:-9.5%;
  transform-origin:50% 100%;
  border-radius:52% 52% 40% 40% / 62% 62% 34% 34%;
  background:linear-gradient(180deg,#fff2b0 0%,#ffd63f 42%,#f7a723 100%);
  box-shadow:inset 0 -6px 10px rgba(191,105,12,.28);
}
.petal::after{                    /* nervadura del pétalo */
  content:""; position:absolute; left:50%; top:12%;
  width:1.5px; height:70%; margin-left:-.75px;
  background:rgba(180,105,15,.28);
  border-radius:2px;
}
.ring-back .petal{
  height:44%; width:17%; margin-left:-8.5%;
  background:linear-gradient(180deg,#ffd964 0%,#f6b227 45%,#dd8a12 100%);
  filter:brightness(.88);
}

.center{
  position:absolute; left:50%; top:50%;
  width:40%; height:40%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle at 34% 28%, rgba(255,255,255,.16), transparent 48%),
    repeating-radial-gradient(circle at 50% 50%, #2a1707 0 2.5px, #120a03 2.5px 5px),
    #170d04;
  box-shadow:
    0 0 0 4% #e8a521,
    inset 0 0 16px rgba(0,0,0,.85),
    0 6px 14px rgba(0,0,0,.45);
}

@keyframes bloom{
  to{ transform:scale(1) rotate(var(--rot,0deg)); opacity:1; }
}
@keyframes sway{
  0%,100%{ transform:translateY(0) rotate(-2deg); }
  50%    { transform:translateY(-8px) rotate(2deg); }
}
@keyframes wrapSway{
  0%,100%{ transform:translateX(-50%) rotate(-1deg); }
  50%    { transform:translateX(-50%) rotate(1deg); }
}

/* florecitas decorativas del título */
.deco{ position:absolute; opacity:.75; z-index:1; }

.glow-btn{
  margin-top:6px;
  border:1px solid rgba(255,220,91,.55);
  background:linear-gradient(135deg,#ffd83d,#ffad00);
  color:#211506; padding:13px 30px; border-radius:999px;
  font-weight:700; cursor:pointer;
  box-shadow:0 0 30px rgba(255,191,32,.25);
  transition:transform .2s, box-shadow .2s;
}
.glow-btn:hover{ transform:translateY(-3px) scale(1.03); box-shadow:0 0 45px rgba(255,191,32,.45); }
.glow-btn span{ margin-right:7px; }

/* ---------- CARTA ---------- */
.letter-screen{ overflow-y:auto; padding:55px 16px 80px; align-items:start; }
.letter{
  width:min(570px,94vw); min-height:660px;
  padding:60px 32px 34px; position:relative;
  color:var(--ink); text-align:center;
  background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.25)), var(--paper);
  box-shadow:0 30px 90px rgba(0,0,0,.6);
  transform:rotate(-.7deg); border-radius:2px;
}
.letter::before{ content:""; position:absolute; inset:10px; border:1px solid rgba(106,69,35,.16); pointer-events:none; }
.tape{ position:absolute; top:-9px; left:50%; width:125px; height:31px; transform:translateX(-50%) rotate(1deg); background:rgba(221,188,88,.6); }
.heart-seal{ position:absolute; top:24px; right:24px; width:44px; height:44px; display:grid; place-items:center; border-radius:50%; background:#b93a42; color:#fff; box-shadow:0 5px 12px rgba(0,0,0,.2); }
.close-btn{ position:fixed; top:calc(18px + env(safe-area-inset-top,0px)); right:18px; z-index:20; border:0; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.12); color:#fff; font-size:26px; cursor:pointer; backdrop-filter:blur(8px); }
.photo-frame{ width:min(390px,82vw); height:240px; margin:0 auto 26px; padding:10px; background:#fff; box-shadow:0 9px 20px rgba(57,37,20,.18); transform:rotate(.6deg); overflow:hidden; }
.photo-frame img{ width:100%; height:100%; object-fit:cover; object-position:center 15%; }
.photo-placeholder{ display:none; width:100%; height:100%; align-items:center; justify-content:center; flex-direction:column; gap:8px; background:linear-gradient(135deg,#ece1c9,#fff9ed); color:#765b43; }
.photo-placeholder span{ font-size:40px; }
.letter h2{ margin:0 0 18px; font-size:2rem; font-weight:500; color:#7d342d; font-style:italic; }
.letter p{ max-width:430px; margin:0 auto; font-size:1.06rem; line-height:1.85; white-space:pre-line; }
.signature{ margin-top:26px !important; font-style:italic; }
.signature span{ font-size:1.25rem; }
.small-btn{ margin-top:26px; border:1px solid rgba(90,55,28,.25); background:transparent; color:#754832; border-radius:999px; padding:10px 18px; cursor:pointer; }

/* ---------- FONDO ---------- */
.stars,.petals{ position:fixed; inset:0; pointer-events:none; z-index:1; }
.star{ position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; animation:twinkle var(--duration) ease-in-out infinite; opacity:.5; }
@keyframes twinkle{ 0%,100%{ opacity:.15; transform:scale(.8);} 50%{ opacity:1; transform:scale(1.8);} }
.petal-fall{ position:absolute; top:-30px; width:11px; height:19px; border-radius:100% 0 100% 0; background:linear-gradient(180deg,#ffe487,#f5ad24); opacity:.9; animation:fall var(--duration) linear forwards; }
@keyframes fall{ to{ transform:translate3d(var(--drift),112vh,0) rotate(720deg); opacity:0; } }

.music-btn{ position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:30; width:48px; height:48px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:rgba(15,12,20,.7); color:#fff; cursor:pointer; backdrop-filter:blur(10px); }
.music-hint{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:30; transform:translateX(-50%); padding:9px 14px; border-radius:999px; background:rgba(20,16,24,.78); border:1px solid rgba(255,255,255,.1); color:#ddd5df; font:12px Arial,sans-serif; backdrop-filter:blur(8px); transition:opacity .4s; }
.music-hint.hidden{ opacity:0; pointer-events:none; }

@media (max-width:600px){
  .letter{ min-height:600px; padding:52px 20px 26px; }
  .photo-frame{ height:200px; }
  .letter p{ font-size:.98rem; }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  .flower-in{ opacity:1; transform:none; }
}
</style>
</head>
<body>
<div id="stars" class="stars" aria-hidden="true"></div>
<div id="petals" class="petals" aria-hidden="true"></div>

<main class="scene">
  <section id="home" class="screen active">
    <div class="moon-glow"></div>

    <div class="intro">
      <p class="eyebrow">Para alguien muy especial ✨</p>
      <h1>Feliz día de las<br><span>flores amarillas</span></h1>
      <p class="subtitle">Hay detalles que duran un momento… y otros que se quedan para siempre.</p>

      <div class="bouquet" id="bouquet" aria-label="Ramo de flores amarillas">
        <div class="stems"></div>
        <div class="leaf leaf-l"></div>
        <div class="leaf leaf-r"></div>
        <div class="wrap"></div>
        <div class="ribbon"></div>
      </div>

      <button id="openBtn" class="glow-btn"><span>💌</span> Ábreme</button>
    </div>
  </section>

  <section id="letter" class="screen letter-screen" aria-hidden="true">
    <button id="closeBtn" class="close-btn" aria-label="Cerrar">×</button>
    <article class="letter">
      <div class="tape"></div>
      <div class="heart-seal">♥</div>

      <div class="photo-frame">
        <img id="photo" src="assets/Snapchat-243135887.jpg" alt="Nuestra fotografía"
             onerror="this.style.display='none'; document.querySelector('.photo-placeholder').style.display='flex';">
        <div class="photo-placeholder">
          <span>📷</span>
          <small>Coloca tu foto en<br><b>assets/foto.jpg</b></small>
        </div>
      </div>

      <h2 id="letterTitle">Mi lugar favorito</h2>
      <p id="message"></p>
      <p class="signature"><span id="signature">❤️</span></p>

      <button id="againBtn" class="small-btn">🌻 Volver a ver las flores</button>
    </article>
  </section>
</main>

<div id="musicHint" class="music-hint"><span>🎵</span> Agrega <b>assets/musica.mp3</b> para tener música</div>
<button id="musicBtn" class="music-btn" aria-label="Activar música">🎵</button>
<audio id="music" loop preload="none"><source src="assets/musica.mp3" type="audio/mpeg"></audio>

<script>
/* ==========================================================
   🌻 FLORES AMARILLAS — Personalización
   ========================================================== */
const CONFIG = {
  title: "Mi lugar favorito",
  message: `De todas las estrellas que hay allá arriba,
ninguna brilla como tú cuando me miras.
Mi lugar favorito del mundo siempre será
donde pueda compartir un momento contigo.`,
  signature: "Con cariño ❤️",
  petalos: 13   // pétalos por corona de cada girasol
};

/* Posición de cada girasol dentro del ramo (en % del ramo).
   x/y = posición, s = tamaño, rot = inclinación, z = capa */
const FLORES = [
  { x:50, y:30, s:.30, rot:  0, z:4, delay:.05 },
  { x:28, y:38, s:.27, rot:-10, z:3, delay:.18 },
  { x:72, y:38, s:.27, rot: 10, z:3, delay:.26 },
  { x:36, y:15, s:.24, rot: -7, z:2, delay:.34 },
  { x:64, y:15, s:.24, rot:  8, z:2, delay:.42 },
  { x:16, y:18, s:.20, rot:-16, z:1, delay:.50 },
  { x:84, y:20, s:.20, rot: 15, z:1, delay:.58 },
  { x:50, y:52, s:.22, rot:  4, z:5, delay:.66 }
];

const $ = id => document.getElementById(id);
const home = $("home"), letter = $("letter"), petals = $("petals"), stars = $("stars");
const music = $("music"), musicBtn = $("musicBtn"), musicHint = $("musicHint");

$("letterTitle").textContent = CONFIG.title;
$("message").textContent = CONFIG.message;
$("signature").textContent = CONFIG.signature;

/* --- Construir un girasol --- */
function crearGirasol({ size, rot = 0, delay = 0, sway = 6 }) {
  const flower = document.createElement("div");
  flower.className = "flower";
  flower.style.setProperty("--size", size);

  const inner = document.createElement("div");
  inner.className = "flower-in";
  inner.style.setProperty("--rot", rot + "deg");
  inner.style.setProperty("--delay", delay + "s");

  const core = document.createElement("div");
  core.className = "flower-core";
  core.style.setProperty("--sway", sway + "s");
  core.style.setProperty("--delay", delay + "s");

  const n = CONFIG.petalos;
  const paso = 360 / n;

  // corona trasera (desfasada media posición)
  const back = document.createElement("div");
  back.className = "ring ring-back";
  back.style.cssText = "position:absolute;inset:0;";
  for (let i = 0; i < n; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    p.style.transform = `rotate(${i * paso + paso / 2}deg)`;
    back.appendChild(p);
  }

  // corona frontal
  const front = document.createElement("div");
  front.className = "ring ring-front";
  front.style.cssText = "position:absolute;inset:0;";
  for (let i = 0; i < n; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    const jitter = (Math.random() - .5) * 4;          // ligera irregularidad natural
    p.style.transform = `rotate(${i * paso + jitter}deg)`;
    front.appendChild(p);
  }

  const center = document.createElement("div");
  center.className = "center";

  core.append(back, front, center);
  inner.appendChild(core);
  flower.appendChild(inner);
  return flower;
}

/* --- Armar el ramo --- */
function crearRamo() {
  const ramo = $("bouquet");
  FLORES.forEach(f => {
    const el = crearGirasol({
      size: (f.s * 100) + "%",
      rot: f.rot,
      delay: f.delay,
      sway: 5 + Math.random() * 3
    });
    el.style.left = f.x + "%";
    el.style.top = f.y + "%";
    el.style.setProperty("--z", f.z);
    ramo.appendChild(el);
  });
}

/* --- Florecitas decorativas alrededor del título --- */
function crearDecoraciones() {
  const posiciones = [
    { top: "18%", left: "6%",  size: "58px", d: .9 },
    { top: "12%", right:"8%",  size: "44px", d: 1.2 },
    { top: "58%", left: "4%",  size: "38px", d: 1.5 }
  ];
  posiciones.forEach(p => {
    const el = crearGirasol({ size: p.size, rot: Math.random() * 30 - 15, delay: p.d, sway: 7 });
    el.classList.add("deco");
    el.style.position = "fixed";
    Object.assign(el.style, { top: p.top, left: p.left || "", right: p.right || "" });
    el.style.margin = "0";
    document.body.appendChild(el);
  });
}

/* --- Estrellas --- */
function createStars(amount = 110) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < amount; i++) {
    const s = document.createElement("span");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.setProperty("--duration", (2 + Math.random() * 4) + "s");
    s.style.animationDelay = Math.random() * 4 + "s";
    const size = Math.random() < .15 ? 3 : 1 + Math.random() * 2;
    s.style.width = s.style.height = size + "px";
    frag.appendChild(s);
  }
  stars.appendChild(frag);
}

/* --- Lluvia de pétalos --- */
function flowerRain(amount = 35) {
  for (let i = 0; i < amount; i++) {
    setTimeout(() => {
      const p = document.createElement("span");
      p.className = "petal-fall";
      p.style.left = Math.random() * 100 + "%";
      p.style.setProperty("--duration", (3 + Math.random() * 4) + "s");
      p.style.setProperty("--drift", (-120 + Math.random() * 240) + "px");
      p.style.animationDelay = Math.random() * .8 + "s";
      petals.appendChild(p);
      setTimeout(() => p.remove(), 9000);
    }, i * 70);
  }
}

function showLetter() {
  home.classList.remove("active");
  letter.classList.add("active");
  letter.setAttribute("aria-hidden", "false");
  flowerRain(45);
}
function showHome() {
  letter.classList.remove("active");
  home.classList.add("active");
  letter.setAttribute("aria-hidden", "true");
}

$("openBtn").addEventListener("click", showLetter);
$("closeBtn").addEventListener("click", showHome);
$("againBtn").addEventListener("click", showHome);

/* --- Música --- */
let musicPlaying = false;
musicBtn.addEventListener("click", async () => {
  try {
    if (musicPlaying) {
      music.pause(); musicPlaying = false; musicBtn.textContent = "🎵";
    } else {
      await music.play(); musicPlaying = true; musicBtn.textContent = "🔊";
      musicHint.classList.add("hidden");
    }
  } catch {
    musicHint.classList.remove("hidden");
    musicHint.innerHTML = "🎵 Coloca tu archivo en <b>assets/musica.mp3</b>";
  }
});
setTimeout(() => musicHint.classList.add("hidden"), 8000);

crearRamo();
crearDecoraciones();
createStars();
setTimeout(() => flowerRain(12), 1200);
</script>
</body>
</html>
